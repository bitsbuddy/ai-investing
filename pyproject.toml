[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investing"
version = "0.1.0"
description = "Risk-managed systematic trading on Alpaca."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-investing = "ai_investing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
